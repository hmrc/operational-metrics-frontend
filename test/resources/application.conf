appName = "operational-metrics-frontend"

play.filters.disabled += "play.filters.csrf.CSRFFilter"
play.filters.disabled += "play.filters.csp.CSPFilter"

catalogue-frontend {
  base-url = "http://localhost:9017"
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "operational-metrics-frontend"
}

microservice.services {
  auth {
    protocol = http
    host     = localhost
    port     = 8500
  }

  feedback-frontend {
    protocol = http
    host     = localhost
    port     = 9514
  }

  operational-metrics {
    protocol = http
    host     = localhost
    port     = 8863
  }
}

urls {
  login         = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue = "http://localhost:9000/operational-metrics-frontend"
  signOut       = "http://localhost:9553/bas-gateway/sign-out-without-state"
}

host = "http://localhost:9000"

mongodb {
  uri                 = "mongodb://localhost:27017/operational-metrics-frontend-test"
  timeToLiveInSeconds = 900
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

features {
  welsh-translation = true
}
